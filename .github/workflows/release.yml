# A tag (v0.1.0, v0.2.0…) builds the release and publishes it. Windows
# x64 is the only platform for now; the list grows when the others do.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0
          # The official source: the third-party mirrors have not
          # carried 0.17.0 yet.
          mirror: https://ziglang.org/download

      # The release is tested, not merely built: a broken release is
      # worse than no release.
      - name: Test
        run: zig build test

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="nanoflowvision-${TAG}-windows-x64"
          mkdir -p "${STAGE}"
          cp zig-out/bin/nanoflowvision.exe "${STAGE}/"
          cp README.md "${STAGE}/"
          cp ROADMAP.md "${STAGE}/"
          7z a "${STAGE}.zip" "${STAGE}"
          sha256sum "${STAGE}.zip" > "${STAGE}.zip.sha256"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nanoflowvision-*-windows-x64.zip
            nanoflowvision-*-windows-x64.zip.sha256
          generate_release_notes: true
