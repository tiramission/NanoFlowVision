# A tag (v0.1.0, v0.2.0…) builds the release and publishes it. Windows
# x64 is the only platform for now; the list grows when the others do.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ZIG_URL: https://ziglang.org/download/0.17.0/zig-x86_64-windows-0.17.0.zip
  ZIG_SHA256: b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        shell: bash
        run: |
          curl -sSLo zig.zip "$ZIG_URL"
          echo "$ZIG_SHA256  zig.zip" | sha256sum -c -
          7z x zig.zip > /dev/null
          # GITHUB_PATH wants a Windows path; bash's PWD is POSIX.
          cygpath -w "$PWD/zig-x86_64-windows-0.17.0" >> "$GITHUB_PATH"

      # The release is tested, not merely built: a broken release is
      # worse than no release.
      - name: Test
        shell: bash
        run: zig build test

      - name: Build (ReleaseFast)
        shell: bash
        run: zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v2

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="nanoflowvision-${TAG}-windows-x64"
          mkdir -p "${STAGE}"
          cp zig-out/bin/nanoflowvision.exe "${STAGE}/"
          cp README.md "${STAGE}/"
          cp ROADMAP.md "${STAGE}/"
          7z a "${STAGE}.zip" "${STAGE}"
          sha256sum "${STAGE}.zip" > "${STAGE}.zip.sha256"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nanoflowvision-*-windows-x64.zip
            nanoflowvision-*-windows-x64.zip.sha256
          generate_release_notes: true
