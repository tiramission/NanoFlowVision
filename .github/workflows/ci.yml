# The app, built and tested on every push and pull request. Windows is
# the platform of record for now; the others wait for their hardware
# (see ROADMAP's platform debt).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The official Zig 0.17.0 for Windows, with its digest. setup-zig's
  # mirrors have not carried 0.17.0 and it refuses ziglang.org as a
  # mirror, so the tarball is fetched by hand.
  ZIG_URL: https://ziglang.org/download/0.17.0/zig-x86_64-windows-0.17.0.zip
  ZIG_SHA256: b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        shell: bash
        run: |
          curl -sSLo zig.zip "$ZIG_URL"
          echo "$ZIG_SHA256  zig.zip" | sha256sum -c -
          7z x zig.zip > /dev/null
          # GITHUB_PATH wants a Windows path; bash's PWD is POSIX.
          cygpath -w "$PWD/zig-x86_64-windows-0.17.0" >> "$GITHUB_PATH"

      - name: Test
        shell: bash
        run: zig build test

      - name: Build (ReleaseFast)
        shell: bash
        run: zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v2

      # The build means nothing if its window comes up blank: render the
      # app offscreen over the test pictures and keep the picture.
      - name: Snapshot
        shell: bash
        run: |
          mkdir -p .ci-photos
          cp src/photo.jpg .ci-photos/a.jpg
          cp src/photo.jpg .ci-photos/b.jpg
          cp src/photo.jpg .ci-photos/c.jpg
          ./zig-out/bin/nanoflowvision.exe "$PWD/.ci-photos" --nanoui-snapshot=ci-shot.png --nanoui-wait=2
          test -s ci-shot.png

      # The artifact of a passing run: the exe a person can run.
      - uses: actions/upload-artifact@v4
        with:
          name: nanoflowvision-windows-x64
          path: zig-out/bin/nanoflowvision.exe
